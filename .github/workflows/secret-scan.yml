name: Secret Scan

# Blocks any commit/PR that introduces a hardcoded secret (API key, token, etc.).
# Runs the open-source gitleaks binary directly — no GitHub Action wrapper, so no
# org license is required. Scans the full commit history of the ref being checked.

on:
  push:
    branches: [release, main]
  pull_request:
    branches: [release, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git . --redact --verbose --exit-code 1
